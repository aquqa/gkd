name: Build-Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（例如 v1.12.1）'
        required: true
        default: 'v1.12.1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: prepare release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            echo "Version must start with v, for example v1.12.1 or v1.12.1-beta.1"
            exit 1
          fi
          git tag "$RELEASE_VERSION"

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write gkd secrets info
        run: |
          echo ${{ secrets.GKD_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/gkd.jks
          echo GKD_STORE_FILE='${{ github.workspace }}/gkd.jks' >> gradle.properties
          echo GKD_STORE_PASSWORD='${{ secrets.GKD_STORE_PASSWORD }}' >> gradle.properties
          echo GKD_KEY_ALIAS='${{ secrets.GKD_KEY_ALIAS }}' >> gradle.properties
          echo GKD_KEY_PASSWORD='${{ secrets.GKD_KEY_PASSWORD }}' >> gradle.properties

      - run: chmod 777 ./gradlew
      - run: ./gradlew app:assembleGkdRelease

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: app/build/outputs/apk/gkd/release

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: app/build/outputs

      - uses: actions/upload-artifact@v7
        with:
          name: CHANGELOG.md
          path: CHANGELOG.md

  release:
    needs: build
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: outputs
          path: outputs

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: CHANGELOG.md

      - run: ls -R

      - id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version }}
          commitish: ${{ github.sha }}
          release_name: Release ${{ inputs.version }}
          body_path: ./CHANGELOG.md
          prerelease: ${{ contains(inputs.version, 'beta') }}

      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/app-gkd-release.apk
          asset_name: gkd-${{ inputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive

      - run: zip -r outputs.zip outputs
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: outputs.zip
          asset_name: outputs-${{ inputs.version }}.zip
          asset_content_type: application/zip
